services:
  - type: web
    name: campuscart-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: campuscart
      - key: CORS_ORIGINS
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_BASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v1
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_LLM_PROVIDER
        value: openai
      - key: BACKBOARD_MODEL
        value: gpt-4o
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ADMIN_UPI_ID
        value: im45145v@oksbi
      - key: SEED_DEMO
        sync: false
  - type: web
    name: campuscart-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
